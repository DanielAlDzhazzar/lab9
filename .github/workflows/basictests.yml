name: lab9-basic-tests
on:
  push:
    branches: [ main, test ]
jobs:
  lab9-basic-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make script executable
        run: chmod +x validate-data.sh
      - name: Run validation tests
        run: |
          ./validate-data.sh "pearse mccarthy" "0831122334"
          ./validate-data.sh "pearse mccarthy" "08311223344"
          ./validate-data.sh "pearseT mccarthy" "0831122334"
