name: lab9-basic-tests
on:
  push:
    branches: [ main, test ]
jobs:
  lab9-basic-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make script executable
        run: chmod +x validate-data.sh
      - name: Run validation tests
        run: |
          ./validate-data.sh "Daniel" "0830813389"
          ./validate-data.sh "DanielAndSomeTextToFail" "0830813389"
          ./validate-data.sh "Daniel" "000000000000000000830813389"
